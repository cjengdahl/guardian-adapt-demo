name: Aspen Connector Regression

# Each regression/* branch represents one mode of aspen-connector. Pushing
# (or resetting + force-pushing) a branch retriggers just that mode's job —
# push a batch of them to run the whole matrix. GitHub reads this file from
# the pushed branch's own tree, so it must exist identically on every
# regression/* branch, not just main.

on:
  push:
    branches:
      - 'regression/**'

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure mode from branch name
        run: |
          # One api_domain works for every mode as of aspen-connector's
          # gate-mode branch fix: Guardian (A/B) and Extract (D) derive
          # api.->my. internally, Adapt (C) and the gate check stay on
          # api. as given - no per-mode override needed anymore.
          echo "ASPEN_API_DOMAIN=api.securityjourney.dev" >> "$GITHUB_ENV"

          case "${{ github.ref_name }}" in
            regression/mode-a-full)
              echo "needs_scan=true" >> "$GITHUB_ENV"
              echo "ASPEN_SCAN_RESULTS_PATH=snyk-code-results.json" >> "$GITHUB_ENV"
              echo "ASPEN_INSTRUCTION_FILE_PATH=.claude/CLAUDE.md" >> "$GITHUB_ENV"
              echo "ASPEN_AUTO_COMMIT=true" >> "$GITHUB_ENV"
              echo "expect_commit=true" >> "$GITHUB_ENV"
              ;;
            regression/mode-a-guardian-only)
              echo "needs_scan=true" >> "$GITHUB_ENV"
              echo "ASPEN_SCAN_RESULTS_PATH=snyk-code-results.json" >> "$GITHUB_ENV"
              echo "ASPEN_INSTRUCTION_FILE_PATH=.claude/CLAUDE.md" >> "$GITHUB_ENV"
              echo "ASPEN_AUTO_COMMIT=true" >> "$GITHUB_ENV"
              echo "ASPEN_EXCLUDE_GIT_METADATA_FIELDS=all" >> "$GITHUB_ENV"
              echo "expect_commit=true" >> "$GITHUB_ENV"
              ;;
            regression/mode-a-no-commit)
              echo "needs_scan=true" >> "$GITHUB_ENV"
              echo "ASPEN_SCAN_RESULTS_PATH=snyk-code-results.json" >> "$GITHUB_ENV"
              echo "ASPEN_INSTRUCTION_FILE_PATH=.claude/CLAUDE.md" >> "$GITHUB_ENV"
              echo "ASPEN_AUTO_COMMIT=false" >> "$GITHUB_ENV"
              echo "expect_commit=false" >> "$GITHUB_ENV"
              # auto_commit:false still writes the file locally, just skips
              # the git commit/push - so the tree is expected to be dirty here.
              echo "expect_dirty_ok=true" >> "$GITHUB_ENV"
              ;;
            regression/mode-b-full)
              echo "needs_scan=false" >> "$GITHUB_ENV"
              echo 'ASPEN_CWES=["CWE-89","CWE-798"]' >> "$GITHUB_ENV"
              echo "ASPEN_INSTRUCTION_FILE_PATH=.claude/CLAUDE.md" >> "$GITHUB_ENV"
              echo "ASPEN_AUTO_COMMIT=true" >> "$GITHUB_ENV"
              echo "expect_commit=true" >> "$GITHUB_ENV"
              ;;
            regression/mode-b-guardian-only)
              echo "needs_scan=false" >> "$GITHUB_ENV"
              echo 'ASPEN_CWES=["CWE-89","CWE-798"]' >> "$GITHUB_ENV"
              echo "ASPEN_INSTRUCTION_FILE_PATH=.claude/CLAUDE.md" >> "$GITHUB_ENV"
              echo "ASPEN_AUTO_COMMIT=true" >> "$GITHUB_ENV"
              echo "ASPEN_EXCLUDE_GIT_METADATA_FIELDS=all" >> "$GITHUB_ENV"
              echo "expect_commit=true" >> "$GITHUB_ENV"
              ;;
            regression/mode-b-no-commit)
              echo "needs_scan=false" >> "$GITHUB_ENV"
              echo 'ASPEN_CWES=["CWE-89","CWE-798"]' >> "$GITHUB_ENV"
              echo "ASPEN_INSTRUCTION_FILE_PATH=.claude/CLAUDE.md" >> "$GITHUB_ENV"
              echo "ASPEN_AUTO_COMMIT=false" >> "$GITHUB_ENV"
              echo "expect_commit=false" >> "$GITHUB_ENV"
              # auto_commit:false still writes the file locally, just skips
              # the git commit/push - so the tree is expected to be dirty here.
              echo "expect_dirty_ok=true" >> "$GITHUB_ENV"
              ;;
            regression/mode-c)
              echo "needs_scan=false" >> "$GITHUB_ENV"
              echo 'ASPEN_CWES=["CWE-89","CWE-798"]' >> "$GITHUB_ENV"
              echo "expect_commit=false" >> "$GITHUB_ENV"
              ;;
            regression/mode-d)
              echo "needs_scan=true" >> "$GITHUB_ENV"
              echo "ASPEN_SCAN_RESULTS_PATH=snyk-code-results.json" >> "$GITHUB_ENV"
              echo "expect_commit=false" >> "$GITHUB_ENV"
              ;;
            regression/gate-noncompliant)
              echo "needs_scan=false" >> "$GITHUB_ENV"
              echo "is_gate=true" >> "$GITHUB_ENV"
              echo "expect_commit=false" >> "$GITHUB_ENV"
              echo "expect_gate_outcome=failure" >> "$GITHUB_ENV"
              ;;
            regression/gate-compliant)
              echo "needs_scan=false" >> "$GITHUB_ENV"
              echo "is_gate=true" >> "$GITHUB_ENV"
              echo "expect_commit=false" >> "$GITHUB_ENV"
              echo "expect_gate_outcome=success" >> "$GITHUB_ENV"
              ;;
            regression/gate-notfound)
              echo "needs_scan=false" >> "$GITHUB_ENV"
              echo "is_gate=true" >> "$GITHUB_ENV"
              echo "expect_commit=false" >> "$GITHUB_ENV"
              # Unknown email -> per-result error -> fail-open (allowed) by
              # default (ASPEN_GATE_FAIL_OPEN defaults to true), so this
              # should pass just like the compliant case, for a different
              # reason - see the job log for which path it actually took.
              echo "expect_gate_outcome=success" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unknown regression branch: ${{ github.ref_name }}" >&2
              exit 1
              ;;
          esac

      - name: Record pre-run HEAD
        run: echo "before_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Snyk
        if: env.needs_scan == 'true'
        uses: snyk/actions/setup@master

      - name: Run Snyk code test
        if: env.needs_scan == 'true'
        run: snyk code test --sarif > "$ASPEN_SCAN_RESULTS_PATH" || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Aspen (Guardian/Adapt modes)
        if: env.is_gate != 'true'
        # Mode C/D endpoint fixes only landed on gate-mode, not yet the
        # published v0.1.2 tag - use gate-mode here too until that ships.
        uses: SecurityJourney/aspen-connector@gate-mode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          api_domain: ${{ env.ASPEN_API_DOMAIN }}
          api_token: ${{ secrets.GUARDIAN_API_TOKEN }}
          scan_results_path: ${{ env.ASPEN_SCAN_RESULTS_PATH }}
          instruction_file_path: ${{ env.ASPEN_INSTRUCTION_FILE_PATH }}
          cwes: ${{ env.ASPEN_CWES }}
          auto_commit: ${{ env.ASPEN_AUTO_COMMIT }}
          exclude_git_metadata_fields: ${{ env.ASPEN_EXCLUDE_GIT_METADATA_FIELDS || '[]' }}

      # Gate mode isn't published to npm/the v0.1.2 tag yet — installed from
      # the connector's gate-mode branch directly, same as main_alt's
      # aspen-gate-check.yml. `continue-on-error` because the non-compliant
      # fixture is *expected* to fail this step — the real assertion (against
      # expect_gate_outcome) is in the next step, not this one's own outcome.
      - name: Run Aspen (gate check)
        if: env.is_gate == 'true'
        id: aspen_gate
        continue-on-error: true
        uses: SecurityJourney/aspen-connector@gate-mode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          api_domain: api.securityjourney.dev
          api_token: ${{ secrets.GUARDIAN_API_TOKEN }}
          enforce_gate: 'true'

      - name: Assert gate outcome
        if: env.is_gate == 'true'
        run: |
          if [ "${{ steps.aspen_gate.outcome }}" != "$expect_gate_outcome" ]; then
            echo "Expected gate outcome '$expect_gate_outcome' but got '${{ steps.aspen_gate.outcome }}'" >&2
            exit 1
          fi
          echo "Gate outcome matched expectation ($expect_gate_outcome)"

      - name: Assert commit-back happened / didn't
        if: env.is_gate != 'true'
        run: |
          after_sha=$(git rev-parse HEAD)
          if [ "$expect_commit" = "true" ]; then
            if [ "$after_sha" = "$before_sha" ]; then
              echo "Expected a commit-back but HEAD didn't change" >&2
              exit 1
            fi
            if git diff --quiet "$before_sha" "$after_sha" -- "$ASPEN_INSTRUCTION_FILE_PATH"; then
              echo "Expected the instruction file to change but it didn't" >&2
              exit 1
            fi
            echo "Commit-back happened and instruction file changed — correct"
          else
            if [ "$after_sha" != "$before_sha" ]; then
              echo "Expected no commit-back but HEAD changed" >&2
              exit 1
            fi
            # Only tracked-file changes count here - scan-based modes (mode-d)
            # legitimately leave an untracked snyk-code-results.json scratch
            # file behind, which isn't a connector side effect.
            if [ "$expect_dirty_ok" != "true" ] && ! git diff --quiet; then
              echo "Expected a clean working tree but found uncommitted changes to tracked files" >&2
              exit 1
            fi
            echo "No unexpected commit-back — correct"
          fi
