name: Aspen Gate Check

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main_alt

permissions:
  pull-requests: write

jobs:
  gate-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Aspen gate check
        # Gate mode (#17) merged to trunk but hasn't been tagged/published
        # yet - track trunk directly until a new version ships.
        uses: SecurityJourney/aspen-connector@trunk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          api_domain: api.securityjourney.dev
          api_token: ${{ secrets.GUARDIAN_API_TOKEN }}
          enforce_gate: 'true'
          # Optional overrides, uncomment if needed:
          # gate_status_path: /integrations/learner-compliance/status
          # gate_fail_open: 'false'
          # gate_comment_on_failure: 'true'
